name: CI Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Run Jest test suite
        env:
          JWT_SECRET: ci-test-jwt-secret
          NODE_ENV: test
        run: npm test

  frontend-checks:
    name: Frontend Lint, Build & i18n Parity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Build production bundle
        run: npm run build
      - name: Check EN/AR translation key parity
        run: |
          node --input-type=module -e "
            import { TRANSLATIONS } from './src/i18n/translations.js';
            const en = Object.keys(TRANSLATIONS.en).sort();
            const ar = Object.keys(TRANSLATIONS.ar).sort();
            const missingInAr = en.filter((k) => !ar.includes(k));
            const missingInEn = ar.filter((k) => !en.includes(k));
            if (missingInAr.length || missingInEn.length) {
              console.error({ missingInAr, missingInEn });
              process.exit(1);
            }
            console.log('i18n parity OK:', en.length, 'keys');
          "
